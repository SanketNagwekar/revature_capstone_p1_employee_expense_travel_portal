{% extends "base.html" %}
{% block title %}New Travel Request - Expense360 – Reimbursement Portal{% endblock %}

{% block content %}
<div class="page-heading">
    <h1>New Travel Request</h1>
    <p>Submit a business travel request for manager approval</p>
</div>

<div class="card" style="max-width:560px">
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/travel/new">
        <div class="form-group">
            <label for="destination">Destination</label>
            <input type="text" id="destination" name="destination" placeholder="e.g. Mumbai, Maharashtra" required>
        </div>
        <div class="form-group">
            <label for="purpose">Purpose of Travel</label>
            <textarea id="purpose" name="purpose" placeholder="Describe the business purpose..." required></textarea>
        </div>
        <div class="form-group">
            <label for="travel_date">Travel Date</label>
            <input type="date" id="travel_date" name="travel_date" required>
        </div>
        <div class="form-group">
            <label for="return_date">Return Date</label>
            <input type="date" id="return_date" name="return_date" required>
        </div>
        <div class="form-group">
            <label for="estimated_cost">Estimated Cost (optional)</label>
            <input type="number" id="estimated_cost" name="estimated_cost" step="0.01" min="0" placeholder="0.00">
        </div>
        <button type="submit" class="btn btn-primary">Submit Request</button>
        &nbsp;
        <a href="/employee/dashboard" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
