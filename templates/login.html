{% extends "base.html" %}

{% block title %}Login - Expense360 – Reimbursement Portal{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <h1>Expense360<br><span style="font-size:1.1rem; color:#64748b; font-weight:500;">Reimbursement Portal</span></h1>
        <p class="subtitle" style="font-weight:600; color:#f97316;">Your Expenses, Simplified 360°</p>
        <p class="subtitle" style="margin-top:-24px;">Sign in to your account</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
